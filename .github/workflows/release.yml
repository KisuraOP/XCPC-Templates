name: Release PDF

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          pip install -r requirements.txt
          python main.py
          bash script.sh
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            output.tex
            output-bw.tex
          latexmk_use_xelatex: true
          pre_compile: |
            latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode output.tex &
            color_pid=$!
            latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode output-bw.tex &
            mono_pid=$!
            wait "$color_pid"
            wait "$mono_pid"
          extra_fonts: |
            ./fonts/*.otf
            ./fonts/*.ttf
      - run: |
          mv output.pdf "output_${{ github.ref_name }}.pdf"
          mv output-bw.pdf "output_${{ github.ref_name }}_bw.pdf"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            output_${{ github.ref_name }}.pdf
            output_${{ github.ref_name }}_bw.pdf
